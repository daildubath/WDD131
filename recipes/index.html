<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Benge">
    <meta name="description" content="A collection of 'recipes' for WDD131.">
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="A collection of 'recipes' for WDD131.">
    <meta property="og:url" content="https://daildubath.github.io/WDD131/recipes">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="A collection of 'recipes' for WDD131.">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

    <title>RecipeBook</title>
</head>

<body>
    <header>
        <img id="logo" src="recipe-book.png" alt="Recipe Book Logo">
        <H1>RecipeBook</H1>
        <div id="searchBox">
            <input id="search" type="text" placeholder="Find a recipe">
            <button id="searchButton"><img src="search.svg" alt="Search"></button>
        </div>
    </header>

    <main>
        <div id="recipeList">
            <div class="recipe">
                <img src="apple-crisp.jpg" alt="Apple Crisp in a bowl with ice-cream on top.">
                <div class="recipeDetails">
                    <button>dessert</button>
                    <h2>Apple Crisp</h2>
                    <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">☆</span>
                    </span>
                    <p>This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with
                        vanilla ice cream.</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik -
            Flaticon</a>

        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="pinterest_icon.svg" alt="pinterest icon"></a>
        </div>

    </footer>
</body>

</html>
